server:
  port: 8071

spring:
  application:
    name: "configserver"
  profiles:
#    active: native
    active: git
  cloud:
    config:
      server:
#       native:
#       search-locations: "classpath:/config"
        git:
          uri: https://github.com/sohag-aust/microservice-config-properties.git
          default-label: app-config-and-docker-configs # branch name for reading config
          timeout: 5 # 5 seconds, my config server has 5 seconds time to read config from the github repository
          clone-on-start: true
          force-pull: true
          search-paths:
           - ca-publicservice-dv-01/account-management-backend/app-configs
           - ca-publicservice-dv-02/account-management-backend/app-configs

  rabbitmq:
    host: ${SPRING_RABBIT_HOST:localhost}
    port: ${SPRING_RABBIT_PORT:5672}
    username: guest
    password: guest